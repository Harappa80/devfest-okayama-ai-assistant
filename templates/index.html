<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WakuWaku</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>AI Companion</h1>
        </header>
        <div class="character-viewer">
            <img id="character-image" src="/static/images/char-mouth-closed.png" alt="WakuWaku">
        </div>
        <p id="status" aria-live="polite">Ask me something!</p>
        <nav id="sources" aria-label="検索の出典"></nav>
        <iframe id="search-suggestions" title="Google Search suggestions" sandbox="allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
        <audio id="speech-audio" controls hidden></audio>
        <p id="audio-status" role="status"></p>
        <footer class="chat-input-area">
            <select id="voice-select" aria-label="音声"><option value="Kore">Kore</option></select>
            <textarea maxlength="8000" aria-label="メッセージ" id="text-input" placeholder="Ask me anything..."></textarea>
            <button id="send-button" aria-label="送信">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </footer>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
